name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4
      - name: Preparar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Validar a aplicação
        run: pnpm test:run
      - name: Gerar o site
        run: pnpm build
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar os arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
